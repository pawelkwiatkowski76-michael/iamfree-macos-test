name: Test instalacji IamFree 1.2.2
on:
  workflow_dispatch:
    inputs:
      apple_runner:
        description: Wersja macOS dla Apple Silicon
        type: choice
        default: xcode-27
        options:
          - macos-15
          - macos-26
          - xcode-27

permissions: {}

jobs:
  instalacja:
    name: Instalacja i uruchomienie (${{ matrix.cpu }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ${{ inputs.apple_runner }}
            cpu: arm64
            runtime: arm64
          - runner: macos-15-intel
            cpu: x86_64
            runtime: x64
    steps:
      - name: Pobranie publicznego wydania i sprawdzenie pakietu
        shell: bash
        env:
          EXPECTED_CPU: ${{ matrix.cpu }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          sw_vers
          test "$(uname -m)" = "$EXPECTED_CPU"
          curl --fail --silent --show-error --proto '=https' --retry 2 --max-time 120 \
            -o klient.zip https://iamfree.pl/monitoring/pobierz/IamFree-Klient-macOS.zip
          echo '4d6a60cb555c5409d1945475245083120d22240966a432f0eb2652e2a5140ccc  klient.zip' | shasum -a 256 -c -
          /usr/bin/ditto -x -k klient.zip 'Pobrane pliki'
          cd 'Pobrane pliki/IamFree-Klient-macOS'
          test -x 'Instaluj IamFree.command'
          test -x "runtime/$RUNTIME/IamFree"
          "runtime/$RUNTIME/node" -e 'if (require("./aplikacja/wydanie.json").version !== "1.2.2") process.exit(1)'

      - name: Instalacja i sprawdzenie aplikacji w folderze użytkownika
        shell: bash
        run: |
          set -euo pipefail
          app="$HOME/Applications/IamFree Monitoring.app"
          test ! -e "$app"
          if lsof -nP -iTCP:8767 -sTCP:LISTEN -t >/dev/null; then
            echo 'Port 8767 jest zajęty przed rozpoczęciem testu.'
            exit 1
          fi
          cd "$RUNNER_TEMP/Pobrane pliki/IamFree-Klient-macOS"
          if pgrep -x Terminal >/dev/null; then
            echo 'Terminal jest już otwarty przed testem. Potrzebny jest czysty runner.'
            exit 1
          fi
          './Instaluj IamFree.command'
          test -x "$app/Contents/Helpers/IamFree"
          test -x "$app/Contents/Helpers/node"
          test ! -e "$app/Contents/Resources/Otworz.command"
          /usr/bin/codesign --verify --strict --verbose=2 "$app"
          plist="$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = pl.iamfree.monitoring
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = 1.2.2
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$plist")" = iamfree-monitoring
          test "$(readlink "$HOME/Desktop/IamFree Monitoring")" = "$app"

      - name: Otwarcie panelu po instalacji, z ikony i z adresu portalu
        shell: bash
        run: |
          set -euo pipefail
          port=8767
          resources="$HOME/Applications/IamFree Monitoring.app/Contents/Resources"
          # Observe the disposable runner while Launch Services opens the shortcut.
          (while :; do
            if pgrep -x Terminal >/dev/null; then touch "$RUNNER_TEMP/terminal-launched"; fi
            sleep 0.25
          done) &
          watcher=$!
          trap 'kill "$watcher" 2>/dev/null || true; launchctl unsetenv IAMFREE_PORT' EXIT
          browser_connected() {
            local pid browser
            for pid in $(lsof -nP -iTCP:"$port" -sTCP:ESTABLISHED -Fpn 2>/dev/null |
              awk -v dest="->127.0.0.1:$port" '/^p/{p=substr($0,2)} /^n/ && index($0,dest){print p}' | sort -u); do
              browser=$(ps -p "$pid" -o comm=) || continue
              case "$browser" in
                *Safari*|*WebKit.Networking*|*Chrome*|*Chromium*|*Firefox*|*firefox*|*Microsoft\ Edge*)
                  echo "Przeglądarka połączona z portem $port: $browser"
                  return 0 ;;
              esac
            done
            return 1
          }
          check_login() {
            local origin="http://127.0.0.1:$port"
            for ((i=0; i<60; i++)); do
              if curl -fsS --max-time 2 "$origin/logowanie" -o "$RUNNER_TEMP/logowanie.html" 2>/dev/null &&
                 grep -Fq 'autocomplete="current-password"' "$RUNNER_TEMP/logowanie.html" && browser_connected; then
                test "$(curl -sS --max-time 3 -o /dev/null -w '%{http_code}' "$origin/api/telemetry")" = 401
                if [ -e "$RUNNER_TEMP/terminal-launched" ] || pgrep -x Terminal >/dev/null; then
                  echo 'Otwarcie panelu uruchomiło Terminal.' >&2
                  return 1
                fi
                return
              fi
              sleep 1
            done
            echo "Nie potwierdzono formularza i połączenia przeglądarki na porcie $port." >&2
            lsof -nP -iTCP:"$port" || true
            return 1
          }
          stop_test_instance() {
            local pid
            pid="$(lsof -nP -iTCP:"$port" -sTCP:LISTEN -t)"
            lsof -a -p "$pid" -d cwd -Fn | grep -Fx "n$resources"
            kill -TERM "$pid"
            for ((i=0; i<15; i++)); do
              if ! kill -0 "$pid" 2>/dev/null; then return 0; fi
              sleep 1
            done
            return 1
          }
          check_login
          stop_test_instance
          # A tab from an earlier launch can reconnect only to its old port.
          port=8768
          launchctl setenv IAMFREE_PORT "$port"
          /usr/bin/open "$HOME/Desktop/IamFree Monitoring"
          check_login
          stop_test_instance
          port=8769
          launchctl setenv IAMFREE_PORT "$port"
          /usr/bin/open 'iamfree-monitoring://open'
          check_login
